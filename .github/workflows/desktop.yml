name: Desktop packages

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"

jobs:
  linux:
    name: Linux (deb + rpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm

      - name: Build packages
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon packageDeb packageRpmWithMenu

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-packages
          if-no-files-found: warn
          path: |
            desktop/build/compose/binaries/main/deb/*.deb
            desktop/build/compose/binaries/main/rpm/*.rpm

  windows:
    name: Windows (msi)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install WiX Toolset 3
        run: choco install wixtoolset -y --no-progress

      - name: Build MSI
        shell: pwsh
        run: |
          $machine = [Environment]::GetEnvironmentVariable("Path", "Machine")
          $user = [Environment]::GetEnvironmentVariable("Path", "User")
          $env:Path = "$machine;$user"
          .\gradlew.bat --no-daemon packageMsi

      - name: Show jpackage logs
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse build\compose\logs -Filter *.txt -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "=== $($_.FullName)"
            Get-Content $_.FullName
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-package
          if-no-files-found: warn
          path: desktop/build/compose/binaries/main/msi/*.msi

  release:
    name: Release
    needs: [linux, windows]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          # По тегу (релиз Android 3.x) версию берём из тега, иначе — из build.gradle.kts.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(grep -m1 '^version = ' desktop/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # В релиз всегда попадает актуальный APK Android: иначе десктопный
      # релиз становится «latest» без приложения для телефона.
      - name: Attach latest Android APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts/apk
          for tag in $(gh release list --limit 30 --json tagName --jq '.[].tagName'); do
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -q '\.apk$'; then
              gh release download "$tag" -p '*.apk' -D artifacts/apk && break
            fi
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: ЛинТех 28 ${{ steps.version.outputs.version }}
          body: |
            Автоматическая сборка десктопного дневника.

            - Linux: `.deb`, `.rpm`
            - Windows: `.msi`
          files: artifacts/**/*
          fail_on_unmatched_files: false
          generate_release_notes: true
          # Тег создаётся вместе с Android-релизом: не затираем его описание.
          append_body: true
