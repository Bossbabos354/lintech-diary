name: Desktop packages

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"

jobs:
  linux:
    name: Linux (deb + rpm)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm

      - name: Build packages
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon packageDeb packageRpmWithMenu

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-packages
          if-no-files-found: warn
          path: |
            desktop/build/compose/binaries/main/deb/*.deb
            desktop/build/compose/binaries/main/rpm/*.rpm

  windows:
    name: Windows (msi)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install WiX Toolset 3
        run: choco install wixtoolset -y --no-progress

      - name: Prepare WiX
        shell: pwsh
        run: |
          .\gradlew.bat --no-daemon downloadWix unzipWix
          $light = Get-ChildItem -Path build\compose -Recurse -Filter light.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $light) { throw "light.exe not found after downloadWix" }
          Write-Host "WiX: $($light.DirectoryName)"
          $light.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build MSI
        shell: pwsh
        run: |
          $machine = [Environment]::GetEnvironmentVariable("Path", "Machine")
          $user = [Environment]::GetEnvironmentVariable("Path", "User")
          $env:Path = "$machine;$user"
          .\gradlew.bat --no-daemon packageMsi

      - name: Show jpackage logs
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse build\compose\logs -Filter *.txt -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "=== $($_.FullName)"
            Get-Content $_.FullName
          }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-package
          if-no-files-found: warn
          path: desktop/build/compose/binaries/main/msi/*.msi
