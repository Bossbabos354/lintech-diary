name: Pages (веб-версия)

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Собрать содержимое сайта
        run: |
          rm -rf /tmp/site && mkdir -p /tmp/site
          cp -r web/. /tmp/site/

      - name: Опубликовать ветку gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-new
          git rm -rf . > /dev/null
          cp -r /tmp/site/. .
          git add -A
          git commit -m "Pages: ${GITHUB_SHA}"
          git push -f origin gh-pages-new:gh-pages
