plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.nomanr.plugin.lumo'
}

def signingProps = new Properties()
def signingPropsFile = rootProject.file("signing.properties")
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}

android {
    namespace 'ru.school28.diary'
    compileSdk 34

    defaultConfig {
        applicationId "ru.school28.diary"
        minSdk 21
        targetSdk 34
        versionCode 105
        versionName "3.0.4"

        // Временно — последний релиз GitHub, пока сайт недоступен.
        // Вернуть сайт: "http://d91950hv.beget.tech/update.json" + старый разбор update.json.
        buildConfigField "String", "UPDATE_URL", "\"https://api.github.com/repos/Bossbabos354/lintech-diary/releases/latest\""
    }

    signingConfigs {
        if (signingPropsFile.exists()) {
            debug {
                storeFile file(signingProps.getProperty("storeFile"))
                storePassword signingProps.getProperty("storePassword")
                keyAlias signingProps.getProperty("keyAlias")
                keyPassword signingProps.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // Jetpack Compose (Kotlin 2.0 + Compose 1.7)
    implementation platform('androidx.compose:compose-bom:2024.09.00')
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    // Lifecycle для Compose
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'

    // Фоновые уведомления об оценках и д/з
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    // QR-сканер (ZXing embedded) + WebView
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // Загрузка картинок (Coil) — для событий
    implementation 'io.coil-kt:coil-compose:2.6.0'

    // Java 8+ API на Android 5–7 (desugaring)
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}