<script>
// ---------------- Тема ----------------
const THEME_KEY = 'diary_theme';
function applyTheme() {
  const saved = localStorage.getItem(THEME_KEY) || 'system';
  if (saved === 'zhan') { document.documentElement.setAttribute('data-theme', 'zhan'); return; }
  const dark = saved === 'dark' || (saved === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
}
applyTheme();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
const getTheme = () => localStorage.getItem(THEME_KEY) || 'system';
const setTheme = (t) => { localStorage.setItem(THEME_KEY, t); applyTheme(); };

// ---------------- Состояние ----------------
const L_KEY = 'diary_login';
const P_KEY = 'diary_password';
const S_KEY = 'diary_student_id';
const Y_KEY = 'diary_uch_year';
const U_KEY = 'diary_user_id';
const C_KEY = 'diary_class_id';

let state = { tab: 'dairy' };

const $ = (id) => document.getElementById(id);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

function overlay() { return $('overlay'); }
function showOverlay(child) {
  const o = overlay();
  o.innerHTML = '';
  o.appendChild(child);
  o.classList.remove('hidden');
}
function hideOverlay() { overlay().classList.add('hidden'); overlay().innerHTML = ''; }

// ---------------- Хранилище (аналог Prefs) ----------------
const Prefs = {
  login: () => localStorage.getItem(L_KEY) || '',
  password: () => localStorage.getItem(P_KEY) || '',
  studentId: () => parseInt(localStorage.getItem(S_KEY), 10) || -1,
  setStudentId: (id) => localStorage.setItem(S_KEY, String(id)),
  setUchYear: (y) => localStorage.setItem(Y_KEY, String(y)),
  uchYear: () => parseInt(localStorage.getItem(Y_KEY), 10) || new Date().getFullYear(),
  setUserId: (id) => localStorage.setItem(U_KEY, String(id)),
  userId: () => parseInt(localStorage.getItem(U_KEY), 10) || -1,
  setClassId: (id) => localStorage.setItem(C_KEY, String(id)),
  classId: () => parseInt(localStorage.getItem(C_KEY), 10) || -1,
  saveCredentials: (login, password, sid) => {
    localStorage.setItem(L_KEY, login);
    localStorage.setItem(P_KEY, password);
    localStorage.setItem(S_KEY, String(sid));
  },
  clearCredentials: () => {
    [L_KEY, P_KEY, S_KEY, Y_KEY, U_KEY, C_KEY].forEach(k => localStorage.removeItem(k));
  },
};

// ---------------- Экран «Дневник» ----------------
function renderDairy() {
  const wrap = el('div');
  const weekbar = el('div', 'weekbar');
  const prev = el('button', 'btn ghost small', '◀');
  const label = el('div', 'label', '…');
  const next = el('button', 'btn ghost small', '▶');
  weekbar.appendChild(prev); weekbar.appendChild(label); weekbar.appendChild(next);
  const todayWrap = el('div', 'today-wrap');
  const todayBtn = el('button', 'btn secondary small', 'Сегодня');
  todayWrap.appendChild(todayBtn);
  wrap.appendChild(weekbar); wrap.appendChild(todayWrap);

  let weekOffset = 0;
  const listCont = el('div');
  let reqSeq = 0;

  async function load() {
    const seq = ++reqSeq;
    listCont.innerHTML = '<div class="spinner"></div>';
    try {
      const sid = Prefs.studentId();
      if (sid === -1) throw new Error('Нет данных об ученике');
      let cid = Prefs.classId();
      if (cid === -1) {
        cid = await Diary.getStudentClass(sid, Prefs.uchYear());
        Prefs.setClassId(cid);
      }
      const { monday, sunday } = Diary.weekRange(weekOffset);
      const fmt = new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'short' });
      label.textContent = `${fmt.format(monday)} — ${fmt.format(sunday)}`;
      const entries = await Diary.getDairy(cid, sid, monday, sunday);

      if (seq !== reqSeq) return; // более новые запросы уже пошли — игнорируем

      if (!entries.length) {
        listCont.innerHTML = '<div class="state-msg">Нет данных за эту неделю</div>';
        return;
      }
      listCont.innerHTML = '';
      const groups = groupByDay(entries);
      groups.forEach(day => listCont.appendChild(renderDay(day)));
    } catch (e) {
      if (seq !== reqSeq) return;
      listCont.innerHTML = `<div class="state-msg error">Ошибка: ${escapeHtml(e.message)}</div>`;
    }
  }
  prev.onclick = () => { weekOffset -= 1; load(); };
  next.onclick = () => { weekOffset += 1; load(); };
  todayBtn.onclick = () => { weekOffset = 0; load(); };

  wrap.appendChild(listCont);
  load();
  return wrap;
}

function localDayKey(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

function groupByDay(entries) {
  // Группируем по ЛОКАЛЬНОЙ дате (не UTC): toISOString() сдвигал день на –1
  // для UTC+3 (локальная полночь = 21:00 предыдущего дня UTC).
  const map = new Map();
  for (const e of entries) {
    const key = localDayKey(e.date);
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(e);
  }
  const sorted = Array.from(map.entries()).sort((a, b) => a[0].localeCompare(b[0]));
  return sorted.map(x => x[1]);
}

const SUBJ_COLORS = ['#7C4DFF', '#FF4081', '#00BFA6', '#FF9800', '#42A5F5',
  '#66BB6A', '#AB47BC', '#EF5350', '#26C6DA'];
const subjColor = (id) => SUBJ_COLORS[((id % SUBJ_COLORS.length) + SUBJ_COLORS.length) % SUBJ_COLORS.length];
const markGlow = (mark) => {
  const v = parseInt(mark.replace('!', ''), 10);
  if (v >= 5) return '#66BB6A';
  if (v === 4) return '#FFD54F';
  if (v === 3) return '#FF9800';
  return '#EF5350';
};
const markStat = (mark) => {
  const raw = mark.replace('!', '');
  const n = parseInt(raw, 10);
  if (mark.startsWith('!')) return { n, color: 'var(--mark-bad)' };
  if (n >= 4) return { n, color: 'var(--mark-excellent)' };
  if (n === 3) return { n, color: 'var(--mark-good)' };
  return { n, color: 'var(--mark-bad)' };
};

function renderDay(dayEntries) {
  const day = el('div', 'day-group');
  const head = el('div', 'day-head');
  head.innerHTML = `<span class="dot"></span><span>${dayHeader(dayEntries[0].date)}</span>`;
  day.appendChild(head);
  dayEntries.forEach(e => day.appendChild(renderLesson(e)));
  return day;
}
function dayHeader(d) {
  return new Intl.DateTimeFormat('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' }).format(d);
}

function renderLesson(e) {
  const lesson = el('div', 'lesson');
  if (e.mark) lesson.classList.add('glow');
  lesson.style.setProperty('--glow', markGlow(e.mark));
  const avatar = el('div', 'avatar', '<span class="book">📘</span>');
  avatar.style.background = subjColor(e.subjectId);
  lesson.appendChild(avatar);
  const body = el('div', 'lesson-body');
  body.innerHTML += `<div class="subj">${escapeHtml(e.subjectName)}</div>`;
  body.innerHTML += `<div class="theme">${escapeHtml(e.theme || '—')}</div>`;
  if (e.homework) body.innerHTML += `<div class="homework">✓ Д/з: ${escapeHtml(e.homework)}</div>`;
  if (e.teacherFio) body.innerHTML += `<div class="teacher">${escapeHtml(e.teacherFio)}</div>`;
  lesson.appendChild(body);
  if (e.mark) {
    const st = markStat(e.mark);
    const b = el('div', 'mark-badge', String(st.n));
    b.style.background = hexToAlpha(bgHex(st.color));
    b.style.color = st.color;
    lesson.appendChild(b);
  }
  lesson.classList.add('clickable');
  lesson.onclick = () => openLessonSheet(e);
  return lesson;
}
// вспомогательные цветовые функции
const cssColorOf = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function bgHex(varVal) {
  if (!varVal) return '#EF5350';
  // var(--mark-...) -> hex-цвет из темы
  const m = varVal.match(/var\((--[\w-]+)\)/);
  if (m) return cssColorOf(m[1]) || '#EF5350';
  return varVal;
}
function hexToAlpha(hex) {
  let h = hex.replace('#', '');
  if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},0.15)`;
}

const escapeHtml = (s) => String(s ?? '')
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

// ---------------- Раскрывающаяся карточка урока (LessonSheet) ----------------
let sheetEscHandler = null;

function openLessonSheet(e) {
  const card = $('sheetCard');
  const st = e.mark ? markStat(e.mark) : null;
  const dateStr = new Intl.DateTimeFormat('ru-RU',
    { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(e.date);

  card.innerHTML =
    '<div class="sheet-head">' +
      '<div class="sheet-title">' +
        '<div class="sheet-subj">' + escapeHtml(e.subjectName) + '</div>' +
        '<div class="sheet-no">Урок №' + e.lessonNumber + '</div>' +
      '</div>' +
      (st
        ? '<div class="mark-badge sheet-mark" style="background:' + hexToAlpha(bgHex(st.color)) +
          ';color:' + st.color + '">' + st.n + '</div>'
        : '') +
      '<button class="sheet-close" id="sheetClose" aria-label="Закрыть">✕</button>' +
    '</div>' +
    '<div class="sheet-div"></div>' +
    '<div class="sheet-field"><div class="lbl">Дата</div><div class="val">' +
      escapeHtml(dateStr) + '</div></div>' +
    (e.teacherFio
      ? '<div class="sheet-field"><div class="lbl">Учитель</div><div class="val">' +
        escapeHtml(e.teacherFio) + '</div></div>'
      : '') +
    '<div class="sheet-field"><div class="lbl">Тема урока</div><div class="val">' +
      escapeHtml(e.theme || '—') + '</div></div>' +
    '<div class="lbl" style="color:var(--text-secondary);font-size:13px;font-weight:700">Домашнее задание</div>' +
    '<div class="hw-box' + (e.homework ? '' : ' empty') + '">' +
      escapeHtml(e.homework || 'Задано не было') + '</div>';

  const ov = $('sheetOverlay');
  ov.classList.remove('hidden');
  requestAnimationFrame(() => {
    ov.classList.add('show');
    card.classList.add('show');
  });

  $('sheetClose').onclick = closeLessonSheet;
  ov.onclick = (ev) => {
    if (ev.target === ov || ev.target.classList.contains('sheet-wrap')) closeLessonSheet();
  };
  sheetEscHandler = (ev) => { if (ev.key === 'Escape') closeLessonSheet(); };
  document.addEventListener('keydown', sheetEscHandler);
}

function closeLessonSheet() {
  const ov = $('sheetOverlay');
  const card = $('sheetCard');
  ov.classList.remove('show');
  card.classList.remove('show');
  if (sheetEscHandler) {
    document.removeEventListener('keydown', sheetEscHandler);
    sheetEscHandler = null;
  }
  setTimeout(() => {
    ov.classList.add('hidden');
    card.innerHTML = '';
    ov.onclick = null;
  }, 280);
}

// ---------------- Экран «Оценки» ----------------
function renderMarks() {
  const wrap = el('div');
  const cont = el('div');
  wrap.appendChild(cont);
  async function load() {
    cont.innerHTML = '<div class="spinner"></div>';
    try {
      const sid = Prefs.studentId();
      if (sid === -1) throw new Error('Нет данных об ученике');
      let cid = Prefs.classId();
      if (cid === -1) {
        cid = await Diary.getStudentClass(sid, Prefs.uchYear());
        Prefs.setClassId(cid);
      }
      const subjects = await Diary.getMarks(cid, sid, Prefs.uchYear());
      // Средний балл — взвешенный по всем оценкам текущего периода, как в приложении.
      const periodMarks = subjects.flatMap(s => Diary.currentPeriodLessons(s));
      const avg = Diary.weightedAverage(periodMarks);

      cont.innerHTML = '';
      cont.appendChild(renderOverall(avg));
      cont.appendChild(renderCritical(subjects));

      subjects.sort((a, b) => a.subjectName.localeCompare(b.subjectName, 'ru'));
      if (!subjects.length) {
        cont.innerHTML += '<div class="state-msg">Нет данных об оценках</div>';
        return;
      }
      subjects.forEach(s => cont.appendChild(renderSubject(s)));
    } catch (e) {
      cont.innerHTML = `<div class="state-msg error">Ошибка: ${e.message}</div>`;
    }
  }
  load();
  return wrap;
}

function renderCritical(subjects) {
  // Как в приложении: тревожит средний ниже 3,5 или три и более «2».
  const weak = subjects
    .map(s => {
      const lessons = Diary.currentPeriodLessons(s);
      const twos = lessons.filter(m => parseInt(m.mark, 10) <= 2).length;
      return { s, avg: Diary.weightedAverage(lessons), twos };
    })
    .filter(x => (x.avg != null && x.avg < 3.5) || x.twos >= 3)
    .sort((a, b) => (a.avg == null ? 99 : a.avg) - (b.avg == null ? 99 : b.avg));
  const wrap = el('div', 'critical-block');
  if (!weak.length) {
    wrap.innerHTML = '<div class="critical-title">Всё под контролем</div>' +
      '<div class="critical-sub">Нет предметов со средним ниже 3,5</div>';
    return wrap;
  }
  wrap.innerHTML = '<div class="critical-title">Требуют внимания</div>';
  const list = el('div', 'critical-list');
  weak.forEach(({ s, avg, twos }) => {
    const chip = el('div', 'critical-chip');
    const label = avg == null ? 'нет оценок' : avg.toFixed(2).replace('.', ',');
    const twosText = twos >= 3 ? ' · ' + twos + ' «2»' : '';
    chip.innerHTML = '<span>' + escapeHtml(s.subjectName) + '</span><b>' +
      label + twosText + '</b>';
    chip.onclick = () => openGoalSheet(s, 'YEAR');
    list.appendChild(chip);
  });
  wrap.appendChild(list);
  return wrap;
}

function renderOverall(avg) {
  const card = el('div', 'overall');
  const gradeColor = avg == null ? '#fff' : (avg >= 4.5 ? '#66BB6A' : avg >= 3.5 ? '#FFF176' : '#EF5350');
  card.innerHTML = `<div class="caption">Общий средний балл</div>` +
    (avg == null ? '<div class="value">—</div>' : `<div class="value" style="color:${gradeColor}">${avg.toFixed(2).replace('.', ',')}</div>`);
  return card;
}

function renderSubject(s) {
  const card = el('div', 'card subject-card');
  const avatar = el('div', 'avatar', escapeHtml(s.subjectName.slice(0, 2)));
  avatar.style.background = subjColor(s.subjectId);
  const head = el('div', 'subject-head');
  const info = el('div');
  info.innerHTML = `<div class="name">${escapeHtml(s.subjectName)}</div>` +
    (s.teacherName ? `<div class="teacher">${escapeHtml(s.teacherName)}</div>` : '');
  head.appendChild(avatar); head.appendChild(info);
  card.appendChild(head);

  const marks = s.marks.filter(m => m.mark).sort((a, b) => a.date - b.date).slice(-20);
  if (marks.length) {
    const chips = el('div', 'chips');
    marks.forEach(m => {
      const st = markStat(m.mark);
      const chip = el('div', 'chip', String(st.n));
      chip.style.background = hexToAlpha(bgHex(st.color));
      chip.style.color = st.color;
      chips.appendChild(chip);
    });
    card.appendChild(chips);
  }

  const totalsArr = Object.entries(s.totalMarks).sort((a, b) => a[0] - b[0]);
  if (totalsArr.length) {
    const labelOf = (p) => ({ '360000': '1 четв.', '360001': '2 четв.', '360002': '3 четв.', '360003': '4 четв.', '360011': '1 полуг.', '360012': '2 полуг.' }[p] || ('Пер. ' + p));
    card.innerHTML += `<div class="totals">${totalsArr.map(([p, m]) => `${labelOf(p)}: ${escapeHtml(m)}`).join(' · ')}</div>`;
  }

  const periodAvg = Diary.currentPeriodAverage(s);
  if (periodAvg != null) {
    const txt = periodAvg.toFixed(2).replace('.', ',');
    const rounded = Diary.roundedMark(periodAvg);
    const color = periodAvg >= 4.5 ? 'var(--success)' : periodAvg >= 3.5 ? '#FFB74D' : 'var(--error)';
    card.innerHTML += `<div class="subj-avg">Средний за период: ` +
      `<b style="color:${color}">${txt}</b>` +
      `<span class="subj-round" style="background:${hexToAlpha(bgHex(color === 'var(--success)' ? '#66BB6A' : color === 'var(--error)' ? '#EF5350' : '#FFB74D'))};color:${color}">≈ ${rounded}</span></div>`;
  }

  // Подсказка по цели / «Узнать больше» — как в приложении
  const goal = findGoal(s.subjectId, 'YEAR');
  const goalMarks = goal ? Diary.marksForPeriod(s, goal.periodKey) : [];
  const hint = goal ? Diary.hint(goalMarks, goal) : 'Поставь цель по предмету';
  const achieved = goal ? Diary.needed(goalMarks, goal.targetMark, goal.allowedMarks) === 0 : false;
  card.innerHTML += `<div class="goal-hint${achieved ? ' ok' : ''}">` +
    `<span>${escapeHtml(hint)}</span><b>Узнать больше →</b></div>`;

  card.classList.add('clickable');
  card.style.cursor = 'pointer';
  card.onclick = () => openGoalSheet(s, 'YEAR');

  return card;
}

// ---------------- Экран «Поиск» ----------------
function renderSearch() {
  const wrap = el('div');
  const bar = el('div', 'search-bar');
  const input = document.createElement('input');
  input.type = 'text'; input.placeholder = 'Предмет или день недели';
  bar.appendChild(input);

  const dayNames = { 'понедельник':1,'вторник':2,'среда':3,'четверг':4,'пятница':5,'суббота':6,'воскресенье':0,
    'пн':1,'вт':2,'ср':3,'чт':4,'пт':5,'сб':6,'вс':0 };

  const ranges = [
    () => { const { monday, sunday } = Diary.weekRange(0); return [monday, sunday]; },
    () => { const { monday, sunday } = Diary.weekRange(1); return [monday, sunday]; },
  ];
  let period = ranges[0]();
  const periodLine = el('div', 'period-line');
  const fmtRange = () => {
    const f = new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'short' });
    return `Период: ${f.format(period[0])} — ${f.format(period[1])}`;
  };
  periodLine.textContent = fmtRange();
  periodLine.onclick = () => {
    const modal = el('div', 'modal');
    modal.innerHTML = '<h3>Выбор периода дней</h3>';
    const items = ['Текущая неделя', 'Следующая неделя', '14–20 сентября', 'Вся четверть (сентябрь–октябрь)'];
    items.forEach((label, i) => {
      const it = el('div', 'period-item', escapeHtml(label));
      it.onclick = () => {
        const now = new Date();
        if (i === 0) period = Diary.weekRange(0);
        else if (i === 1) period = Diary.weekRange(1);
        else if (i === 2) period = [new Date(now.getFullYear(), 8, 14), new Date(now.getFullYear(), 8, 20)];
        else period = [new Date(now.getFullYear(), 8, 1), new Date(now.getFullYear(), 9, 31)];
        periodLine.textContent = fmtRange();
        hideOverlay();
        doSearch();
      };
      modal.appendChild(it);
    });
    showOverlay(modal);
  };

  const results = el('div');
  bar.appendChild(periodLine);
  bar.appendChild(input);
  wrap.appendChild(bar); wrap.appendChild(results);

  async function doSearch() {
    const query = input.value.trim().toLowerCase();
    if (!query) return;
    results.innerHTML = '<div class="spinner"></div>';
    const requestedDay = dayNames[query];
    try {
      const sid = Prefs.studentId();
      let cid = Prefs.classId();
      if (cid === -1) {
        cid = await Diary.getStudentClass(sid, Prefs.uchYear());
        Prefs.setClassId(cid);
      }
      const entries = await Diary.getDairy(cid, sid, period[0], period[1]);
      const filtered = entries
        .filter(e => e.subjectName.toLowerCase().includes(query)
          || (requestedDay != null && e.date.getDay() === requestedDay))
        .sort((a, b) => a.date - b.date);
      if (!filtered.length) {
        results.innerHTML = '<div class="state-msg">Ничего не найдено</div>';
        return;
      }
      results.innerHTML = '';
      groupByDay(filtered).forEach(d => results.appendChild(renderDay(d)));
    } catch (e) {
      results.innerHTML = `<div class="state-msg error">Ошибка: ${e.message}</div>`;
    }
  }
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });
  return wrap;
}

// ---------------- Расписание ----------------
const SCHEDULE_URLS = ['../data/schedule.json', 'schedule.json'];
const SCHEDULE_DAYS = [
  { key: 'mon', short: 'Пн', full: 'понедельник' },
  { key: 'tue', short: 'Вт', full: 'вторник' },
  { key: 'wed', short: 'Ср', full: 'среду' },
  { key: 'thu', short: 'Чт', full: 'четверг' },
  { key: 'fri', short: 'Пт', full: 'пятницу' },
  { key: 'sat', short: 'Сб', full: 'субботу' }
];
const CLASS_KEY = 'diary_selected_class';

function scheduleTodayKey() {
  const map = ['mon', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat']; // getDay(): 0=вс
  return map[new Date().getDay()] || 'mon';
}

async function fetchSchedule() {
  let lastErr = null;
  for (const u of SCHEDULE_URLS) {
    try {
      const r = await fetch(u, { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('Сайт с расписанием недоступен');
}

function renderSchedule() {
  const wrap = el('div');
  let dayKey = scheduleTodayKey();
  let className = localStorage.getItem(CLASS_KEY) || '';

  async function load() {
    wrap.innerHTML = '<div class="spinner"></div>';
    try {
      const sch = await fetchSchedule();
      const classes = (sch && sch.classes) || [];
      if (!className || classes.indexOf(className) === -1) {
        className = classes[0] || '';
        if (className) localStorage.setItem(CLASS_KEY, className);
      }
      paint(sch, classes);
    } catch (e) {
      wrap.innerHTML = '<div class="state-msg error">Сайт с расписанием недоступен<br>'
        + '<span style="font-size:13px">' + escapeHtml(e.message) + '</span></div>';
    }
  }

  function paint(sch, classes) {
    wrap.innerHTML = '';

    const head = el('div', 'sched-head');
    head.innerHTML = '<b>Класс: ' + escapeHtml(className || 'не выбран') + '</b>' +
      '<span>сменить в настройках</span>';
    wrap.appendChild(head);

    const days = el('div', 'sched-days');
    SCHEDULE_DAYS.forEach(d => {
      const b = el('button', 'sched-day' + (d.key === dayKey ? ' sel' : ''), d.short);
      b.onclick = () => { dayKey = d.key; paint(sch, classes); };
      days.appendChild(b);
    });
    wrap.appendChild(days);

    const list = el('div', 'sched-list');
    const lessons = (((sch.lessons || {})[className] || {})[dayKey] || []).slice()
      .sort((a, b) => a.n - b.n);
    const bells = ((dayKey === 'sat' ? (sch.bells || {}).saturday : (sch.bells || {}).weekday) || []);
    const dayFull = (SCHEDULE_DAYS.find(d => d.key === dayKey) || {}).full || '';

    if (!lessons.length) {
      list.innerHTML = '<div class="state-msg">На ' + escapeHtml(dayFull) + ' уроков нет</div>';
    } else {
      lessons.forEach(l => {
        const bell = bells.find(b => b.n === l.n) || {};
        const details = [l.teacher, l.room ? 'каб. ' + l.room : null]
          .filter(Boolean).map(escapeHtml).join(' · ');
        const row = el('div', 'sched-lesson');
        row.innerHTML =
          '<div class="sched-num"><b>' + l.n + '</b>' +
            (bell.start ? '<span>' + escapeHtml(bell.start) + '</span>' : '') +
            (bell.end ? '<i>' + escapeHtml(bell.end) + '</i>' : '') +
          '</div>' +
          '<div class="sched-info"><div class="sched-subj">' + escapeHtml(l.subject || '') + '</div>' +
            (details ? '<div class="sched-det">' + details + '</div>' : '') +
          '</div>';
        list.appendChild(row);
      });
    }
    wrap.appendChild(list);
  }

  load();
  return wrap;
}

// ---------------- Уведомления ----------------
const NOTIF_KEY = 'diary_notifications';
const NOTIF_MAX = 200;
let notifChecking = false;

function loadNotifications() {
  try { const a = JSON.parse(localStorage.getItem(NOTIF_KEY) || '[]'); return Array.isArray(a) ? a : []; }
  catch (e) { return []; }
}
function saveNotifications(list) { localStorage.setItem(NOTIF_KEY, JSON.stringify(list.slice(0, NOTIF_MAX))); }
function unreadNotifications() { return loadNotifications().filter(n => !n.read).length; }
function appendNotification(title, text, channel, tab) {
  const list = loadNotifications();
  list.unshift({ id: Date.now(), title: title, text: text, channel: channel, time: Date.now(), read: false, tab: tab });
  saveNotifications(list);
  updateBell();
}
function markAllRead() {
  const list = loadNotifications();
  if (!list.some(n => !n.read)) return;
  saveNotifications(list.map(n => ({ ...n, read: true })));
}
function markRead(id) { saveNotifications(loadNotifications().map(n => n.id === id ? { ...n, read: true } : n)); }
function clearNotifications() { saveNotifications([]); }

function updateBell() {
  const b = $('bellBadge');
  if (!b) return;
  const n = unreadNotifications();
  b.textContent = n > 9 ? '9+' : String(n);
  b.classList.toggle('hidden', n === 0);
}

function ddmm(d) {
  const p = n => String(n).padStart(2, '0');
  return p(d.getDate()) + '.' + p(d.getMonth() + 1) + '.' + d.getFullYear();
}

async function checkNotifications() {
  if (notifChecking) return;
  notifChecking = true;

  // События: сравниваем id
  try {
    const events = await fetchEvents();
    if (events.length) {
      const ids = events.map(e => e.id).sort().join('\n');
      const old = localStorage.getItem('diary_notif_events');
      if (old == null) {
        localStorage.setItem('diary_notif_events', ids);
      } else {
        const oldSet = new Set(old.split('\n').filter(Boolean));
        const fresh = events.filter(e => !oldSet.has(e.id));
        localStorage.setItem('diary_notif_events', ids);
        if (fresh.length) {
          const title = fresh.length === 1 ? 'Новое событие' : 'Новые события (' + fresh.length + ')';
          const text = fresh
            .sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')))
            .map(e => '• ' + e.title + (e.date ? ' (' + formatEventDate(e.date) + ')' : ''))
            .join('\n');
          appendNotification(title, text, 'events', 'events');
        }
      }
    }
  } catch (e) { /* сайт недоступен — молча */ }

  // Дневник: новые оценки и домашние задания за 3 дня
  try {
    const sid = Prefs.studentId();
    if (sid !== -1) {
      let cid = Prefs.classId();
      if (cid === -1) { cid = await Diary.getStudentClass(sid, Prefs.uchYear()); Prefs.setClassId(cid); }
      const end = new Date();
      const begin = new Date(); begin.setDate(begin.getDate() - 3);
      const entries = await Diary.getDairy(cid, sid, begin, end);
      if (entries.length) {
        const keys = [];
        const nameMap = {};
        entries.forEach(en => {
          nameMap[en.subjectId] = en.subjectName;
          const ds = ddmm(en.date);
          if (en.mark) keys.push('M:' + en.subjectId + '|' + ds + '|' + en.lessonNumber + '|' + en.mark);
          if (en.homework) keys.push('H:' + en.subjectId + '|' + ds + '|' + en.lessonNumber + '|' + en.homework);
        });
        const cur = keys.slice().sort().join('\n');
        const oldRaw = localStorage.getItem('diary_notif_keys');
        if (oldRaw == null) {
          localStorage.setItem('diary_notif_keys', cur);
        } else {
          const oldSet = new Set(oldRaw.split('\n').filter(Boolean));
          const fresh = keys.filter(k => !oldSet.has(k));
          localStorage.setItem('diary_notif_keys', cur);
          if (fresh.length) {
            const lines = fresh.sort().map(k => {
              const p = k.split('|');
              const subj = nameMap[p[0].replace(/^[MH]:/, '')] || 'Предмет';
              return p[0].charAt(0) === 'M'
                ? subj + ': новая оценка ' + p[3]
                : subj + ': ' + p[3].slice(0, 120);
            });
            const title = lines.length === 1 ? 'Новое в дневнике' : 'Новое в дневнике (' + lines.length + ')';
            appendNotification(title, lines.join('\n'), 'diary', 'dairy');
          }
        }
      }
    }
  } catch (e) { /* нет сети — молча */ }

  notifChecking = false;
  updateBell();
}

function renderNotifications() {
  const wrap = el('div');
  const items = loadNotifications();
  const unreadIds = new Set(items.filter(n => !n.read).map(n => n.id));

  const head = el('div', 'notif-head');
  const back = el('button', 'notif-back', '←');
  back.title = 'Назад';
  back.onclick = () => { state.tab = 'settings'; renderCurrent(); };
  head.appendChild(back);
  const ttl = el('b', '', 'Уведомления');
  head.appendChild(ttl);
  const sp = el('div'); sp.style.flex = '1'; head.appendChild(sp);
  if (items.length) {
    const clear = el('button', 'btn secondary small', 'Очистить');
    clear.onclick = () => { clearNotifications(); updateBell(); renderCurrent(); };
    head.appendChild(clear);
  }
  wrap.appendChild(head);

  if (!items.length) {
    const empty = el('div', 'state-msg');
    empty.innerHTML = '<div style="font-size:40px;opacity:.4">🔔</div>Уведомлений пока нет';
    wrap.appendChild(empty);
  } else {
    items.forEach(n => wrap.appendChild(renderNotifRow(n, unreadIds.has(n.id))));
  }

  // как в приложении: при открытии всё считается прочитанным
  if (unreadIds.size) { markAllRead(); updateBell(); }
  return wrap;
}

function renderNotifRow(n, unread) {
  const row = el('div', 'notif-row' + (unread ? ' unread' : ''));
  const ico = n.channel === 'events' ? '📅' : n.channel === 'update' ? '⬆️' : '📖';
  const col = n.channel === 'events' ? '#4DB6AC' : n.channel === 'update' ? '#9575CD' : '#7E57C2';
  const d = new Date(n.time);
  const time = d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' }) + ', ' +
    d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  row.innerHTML = '<div class="notif-ico" style="background:' + col + '22;color:' + col + '">' + ico + '</div>' +
    '<div class="notif-body">' +
      '<div class="notif-title">' + escapeHtml(n.title) + '</div>' +
      '<div class="notif-text">' + escapeHtml(n.text).replace(/\n/g, '<br>') + '</div>' +
      '<div class="notif-time">' + escapeHtml(time) + '</div>' +
    '</div>';
  row.onclick = () => {
    markRead(n.id);
    const t = n.tab;
    state.tab = (t === 'events' || t === 'goals' || t === 'marks' || t === 'schedule') ? t : 'dairy';
    renderCurrent();
  };
  return row;
}

// ---------------- Цели ----------------
const GOALS_KEY = 'diary_goals';
const GOAL_PERIODS = Diary.periods;

function goalPeriod(key) {
  return Diary.period(key);
}
function loadGoals() {
  try { const a = JSON.parse(localStorage.getItem(GOALS_KEY) || '[]'); return Array.isArray(a) ? a : []; }
  catch (e) { return []; }
}
function saveGoals(list) { localStorage.setItem(GOALS_KEY, JSON.stringify(list)); }
function findGoal(subjectId, periodKey) {
  return loadGoals().find(g => g.subjectId === subjectId && g.periodKey === periodKey) || null;
}
function upsertGoal(goal) {
  const list = loadGoals().filter(g => !(g.subjectId === goal.subjectId && g.periodKey === goal.periodKey));
  list.push(goal);
  saveGoals(list);
}
function removeGoal(subjectId, periodKey) {
  saveGoals(loadGoals().filter(g => !(g.subjectId === subjectId && g.periodKey === periodKey)));
}


function goalPlural(n) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return 'ку';
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return 'ки';
  return 'ок';
}

async function loadSubjects() {
  const sid = Prefs.studentId();
  if (sid === -1) throw new Error('Нет данных об ученике');
  let cid = Prefs.classId();
  if (cid === -1) {
    cid = await Diary.getStudentClass(sid, Prefs.uchYear());
    Prefs.setClassId(cid);
  }
  return await Diary.getMarks(cid, sid, Prefs.uchYear());
}

function renderGoals() {
  const wrap = el('div');
  const cont = el('div');
  wrap.appendChild(cont);

  async function load() {
    cont.innerHTML = '<div class="spinner"></div>';
    try {
      const subjects = await loadSubjects();
      const byId = {};
      subjects.forEach(s => { byId[s.subjectId] = s; });
      const goals = loadGoals();

      cont.innerHTML = '';
      cont.appendChild(el('div', 'goals-title', 'Мои цели'));

      if (!goals.length) {
        const empty = el('div', 'goal-empty');
        empty.innerHTML = '<div class="flag">🚩</div><b>Целей пока нет</b>' +
          '<div style="margin-top:6px;font-size:14px">Открой «Оценки» → выбери предмет → «Узнать больше» и поставь цель</div>';
        cont.appendChild(empty);
        return;
      }
      goals.sort((a, b) => a.subjectName.localeCompare(b.subjectName, 'ru'));
      goals.forEach(g => cont.appendChild(renderGoalCard(g, byId[g.subjectId])));
    } catch (e) {
      cont.innerHTML = '<div class="state-msg error">Ошибка: ' + escapeHtml(e.message) + '</div>';
    }
  }
  load();
  return wrap;
}

function renderGoalCard(goal, subject) {
  const card = el('div', 'card subject-card');
  const marks = subject ? Diary.marksForPeriod(subject, goal.periodKey) : [];
  const hint = subject ? Diary.hint(marks, goal) : 'Нет данных об оценках';
  const achieved = subject ? Diary.needed(marks, goal.targetMark, goal.allowedMarks) === 0 : false;

  const head = el('div', 'goal-head');
  const av = el('div', 'avatar', escapeHtml(goal.subjectName.slice(0, 2)));
  av.style.background = subjColor(goal.subjectId);
  head.appendChild(av);

  const meta = el('div', 'goal-meta');
  meta.innerHTML = '<div class="name">' + escapeHtml(goal.subjectName) + '</div>' +
    '<div class="sub">' + escapeHtml(goalPeriod(goal.periodKey).label) + ' · цель «' + goal.targetMark + '»</div>';
  head.appendChild(meta);

  const st = markStat(String(goal.targetMark));
  const tb = el('div', 'goal-target', String(goal.targetMark));
  tb.style.background = hexToAlpha(bgHex(st.color));
  tb.style.color = st.color;
  head.appendChild(tb);

  const del = el('button', 'goal-del', '✕');
  del.title = 'Удалить цель';
  del.onclick = (e) => {
    e.stopPropagation();
    removeGoal(goal.subjectId, goal.periodKey);
    renderCurrent();
  };
  head.appendChild(del);
  card.appendChild(head);

  const hb = el('div', 'goal-hint' + (achieved ? ' ok' : ''));
  hb.innerHTML = '<span>' + escapeHtml(hint) + '</span><b>Узнать больше</b>';
  card.appendChild(hb);

  card.classList.add('clickable');
  card.style.cursor = 'pointer';
  card.onclick = () => { if (subject) openGoalSheet(subject, goal.periodKey); };
  return card;
}

// ---------------- Карточка цели (полный экран) ----------------
function showSheetCard(html) {
  const card = $('sheetCard');
  card.innerHTML = html;
  const ov = $('sheetOverlay');
  ov.classList.remove('hidden');
  requestAnimationFrame(() => { ov.classList.add('show'); card.classList.add('show'); });
  ov.onclick = (ev) => { if (ev.target === ov || ev.target.classList.contains('sheet-wrap')) closeLessonSheet(); };
  if (sheetEscHandler) { document.removeEventListener('keydown', sheetEscHandler); sheetEscHandler = null; }
  sheetEscHandler = (ev) => { if (ev.key === 'Escape') closeLessonSheet(); };
  document.addEventListener('keydown', sheetEscHandler);
}

function openGoalSheet(subject, initialPeriodKey) {
  const existing = findGoal(subject.subjectId, initialPeriodKey || 'YEAR');
  const gs = {
    periodKey: initialPeriodKey || (existing && existing.periodKey) || 'YEAR',
    targetMark: existing ? existing.targetMark : 5,
    allowed: new Set(existing ? existing.allowedMarks : [5])
  };

  function paint() {
    const marks = Diary.marksForPeriod(subject, gs.periodKey);
    const avg = Diary.weightedAverage(marks);
    const rounded = Diary.roundedMark(avg);
    const allowedArr = Array.from(gs.allowed);
    const needed = Diary.needed(marks, gs.targetMark, allowedArr);
    const avgText = avg == null ? '—' : avg.toFixed(2).replace('.', ',');

    const marksChips = marks.length
      ? marks.map(m => {
          const st = markStat(String(m.mark));
          return '<span class="gs-chip" style="background:' + hexToAlpha(bgHex(st.color)) + ';color:' + st.color + '">' + m.mark + '</span>';
        }).join('')
      : '<span style="color:var(--text-secondary);font-size:14px">Оценок за этот период нет</span>';

    let resultText, resultClass;
    if (!allowedArr.length) { resultText = 'Выбери хотя бы одну оценку'; resultClass = 'err'; }
    else if (needed == null) { resultText = 'С такими оценками цель недостижима'; resultClass = 'err'; }
    else if (needed === 0) { resultText = 'Цель уже достигнута — средний балл достаточно высокий'; resultClass = 'ok'; }
    else {
      resultText = 'Нужно ещё ' + needed + ' оцен' + goalPlural(needed) + ' «' + Math.max.apply(null, allowedArr) + '», чтобы выйти на «' + gs.targetMark + '»';
      resultClass = 'todo';
    }

    const saved = findGoal(subject.subjectId, gs.periodKey);
    const periodOpts = GOAL_PERIODS.map(p =>
      '<option value="' + p.key + '"' + (p.key === gs.periodKey ? ' selected' : '') + '>' + escapeHtml(p.label) + '</option>'
    ).join('');

    const html =
      '<div class="gs-head">' +
        '<div style="flex:1;min-width:0"><div class="tsub">Цель по предмету</div><div class="ttl">' + escapeHtml(subject.subjectName) + '</div></div>' +
        '<button class="gs-close" id="goalClose" aria-label="Закрыть">✕</button>' +
      '</div>' +
      '<div class="gs-block"><div class="bl">Текущие оценки</div><div class="gs-chips">' + marksChips + '</div>' +
        (marks.length ? '<div class="gs-avg">Средний: ' + avgText + (rounded ? ' · тянет на «' + rounded + '»' : '') + '</div>' : '') +
      '</div>' +
      '<div class="gs-block"><div class="bl">За какой период</div>' +
        '<select class="gs-select" id="goalPeriod">' + periodOpts + '</select>' +
      '</div>' +
      '<div class="gs-block"><div class="bl">Какую оценку хочешь</div><div class="gs-row">' +
        [5, 4, 3].map(m => '<button class="gs-choice' + (gs.targetMark === m ? ' sel' : '') + '" data-target="' + m + '">' + m + '</button>').join('') +
      '</div></div>' +
      '<div class="gs-block"><div class="bl">Какими оценками набирать</div><div class="gs-row">' +
        [5, 4, 3, 2].map(m => '<button class="gs-choice' + (gs.allowed.has(m) ? ' sel' : '') + '" data-allowed="' + m + '">' + m + '</button>').join('') +
      '</div><div class="gs-note">Можно выбрать несколько — посчитаем по лучшей из них</div></div>' +
      '<div class="gs-result ' + resultClass + '">' + escapeHtml(resultText) + '</div>' +
      '<button class="btn primary gs-btn" id="goalSave"' + (gs.allowed.size ? '' : ' disabled') + '>Установить цель</button>' +
      (saved ? '<button class="btn destructive gs-btn" id="goalDelete">Удалить цель</button>' : '');

    showSheetCard(html);

    $('goalClose').onclick = closeLessonSheet;
    $('goalPeriod').onchange = (e) => { gs.periodKey = e.target.value; paint(); };
    $('sheetCard').querySelectorAll('[data-target]').forEach(b => {
      b.onclick = () => { gs.targetMark = parseInt(b.getAttribute('data-target'), 10); paint(); };
    });
    $('sheetCard').querySelectorAll('[data-allowed]').forEach(b => {
      b.onclick = () => {
        const v = parseInt(b.getAttribute('data-allowed'), 10);
        if (gs.allowed.has(v)) gs.allowed.delete(v); else gs.allowed.add(v);
        paint();
      };
    });
    $('goalSave').onclick = () => {
      if (!gs.allowed.size) return;
      upsertGoal({
        subjectId: subject.subjectId,
        subjectName: subject.subjectName,
        periodKey: gs.periodKey,
        targetMark: gs.targetMark,
        allowedMarks: Array.from(gs.allowed).sort((a, b) => b - a)
      });
      closeLessonSheet();
      if (state.tab === 'marks' || state.tab === 'goals') renderCurrent();
    };
    const del = $('goalDelete');
    if (del) del.onclick = () => {
      removeGoal(subject.subjectId, gs.periodKey);
      closeLessonSheet();
      if (state.tab === 'marks' || state.tab === 'goals') renderCurrent();
    };
  }
  paint();
}

// ---------------- Экран «События» ----------------
const EVENTS_URLS = ['../data/events.json', 'events.json'];

async function fetchEvents() {
  let lastErr = null;
  for (const u of EVENTS_URLS) {
    try {
      const r = await fetch(u, { cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const j = await r.json();
      return (j && Array.isArray(j.events)) ? j.events : [];
    } catch (e) { lastErr = e; }
  }
  throw lastErr || new Error('Не удалось загрузить события');
}

function formatEventDate(s) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s || ''));
  if (!m) return String(s || '');
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return new Intl.DateTimeFormat('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }).format(d);
}

function renderEvents() {
  const wrap = el('div');
  const top = el('div', 'events-top');
  const qr = el('button', 'btn secondary', '📷 Сканировать QR-код');
  qr.style.width = '100%';
  qr.onclick = openQrScanner;
  top.appendChild(qr);

  const cont = el('div');
  wrap.appendChild(top);
  wrap.appendChild(cont);

  async function load() {
    cont.innerHTML = '<div class="spinner"></div>';
    try {
      const events = await fetchEvents();
      if (!events.length) {
        cont.innerHTML = '<div class="state-msg">Событий пока нет</div>';
        return;
      }
      events.sort((a, b) => String(a.date || '').localeCompare(String(b.date || '')));
      cont.innerHTML = '';
      events.forEach(ev => cont.appendChild(renderEventCard(ev)));
    } catch (e) {
      cont.innerHTML = '<div class="state-msg error">Не удалось загрузить события<br>'
        + '<span style="font-size:13px">' + escapeHtml(e.message) + '</span></div>';
    }
  }
  load();
  return wrap;
}

function renderEventCard(ev) {
  const card = el('div', 'event');
  const head = el('div', 'event-head');
  head.appendChild(el('div', 'event-badge', '📅'));
  head.appendChild(el('div', 'event-title', escapeHtml(ev.title || '')));
  if (ev.link) head.appendChild(el('span', 'event-arrow', '→'));
  card.appendChild(head);

  if (ev.date) card.appendChild(el('div', 'event-date', escapeHtml(formatEventDate(ev.date))));

  if (ev.image) {
    const img = document.createElement('img');
    img.className = 'event-img';
    img.loading = 'lazy';
    img.alt = '';
    img.src = ev.image;
    img.onerror = () => img.remove(); // как в приложении: битая картинка не оставляет пустой блок
    card.appendChild(img);
  }
  if (ev.text) card.appendChild(el('div', 'event-text', escapeHtml(ev.text)));

  if (ev.link) {
    card.classList.add('clickable');
    card.onclick = () => window.open(ev.link, '_blank', 'noopener');
  }
  return card;
}

// ---------------- QR-сканер ----------------
function openQrScanner() {
  const modal = el('div', 'modal');
  modal.innerHTML = '<h3>Сканировать QR-код</h3>';

  const note = el('div', 'muted');
  const video = document.createElement('video');
  video.className = 'qr-video';
  video.setAttribute('playsinline', '');
  video.muted = true;

  const manual = el('div', 'qr-manual');
  manual.appendChild(el('div', 'muted', 'Или вставьте ссылку:'));
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.placeholder = 'https://…';
  const go = el('button', 'btn primary', 'Открыть');
  const actions = el('div', 'modal-actions');
  const cancel = el('button', 'btn secondary', 'Закрыть');
  actions.appendChild(cancel);

  manual.appendChild(inp);
  manual.appendChild(go);
  modal.appendChild(note);
  modal.appendChild(video);
  modal.appendChild(manual);
  modal.appendChild(actions);
  showOverlay(modal);

  let stream = null, timer = 0;
  function cleanup() {
    if (timer) { clearInterval(timer); timer = 0; }
    if (stream) { stream.getTracks().forEach(t => { try { t.stop(); } catch (e) {} }); stream = null; }
  }
  function close() {
    cleanup();
    overlay().onclick = null;
    hideOverlay();
  }
  cancel.onclick = close;
  overlay().onclick = (e) => { if (e.target === overlay()) close(); };

  go.onclick = () => {
    const v = inp.value.trim();
    if (!v) { inp.focus(); return; }
    window.open(v, '_blank', 'noopener');
    close();
  };
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') go.click(); });

  async function start() {
    if (!('BarcodeDetector' in window)) {
      note.textContent = 'Этот браузер не умеет сканировать QR. Вставьте ссылку вручную.';
      return;
    }
    try {
      const detector = new window.BarcodeDetector({ formats: ['qr_code'] });
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      video.srcObject = stream;
      await video.play();
      note.textContent = 'Наведите камеру на QR-код';
      timer = setInterval(async () => {
        try {
          const codes = await detector.detect(video);
          if (codes && codes.length) {
            const raw = (codes[0].rawValue || '').trim();
            if (!raw) return;
            cleanup();
            if (/^https?:\/\//i.test(raw)) {
              window.open(raw, '_blank', 'noopener');
            } else {
              alert('Считано: ' + raw);
            }
            close();
          }
        } catch (e) { /* кадр не распознан — пробуем следующий */ }
      }, 350);
    } catch (e) {
      note.textContent = 'Не удалось включить камеру: ' + e.message + '. Вставьте ссылку вручную.';
    }
  }
  start();
}

// ---------------- Экран «Настройки» ----------------
function renderSettings() {
  const wrap = el('div');
  const cont = el('div');
  wrap.appendChild(cont);
  cont.style.padding = '16px';

  // Аккаунт
  const acc = el('div', 'card section');
  acc.innerHTML = '<h3>Аккаунт</h3>';
  const lInput = document.createElement('input'); lInput.type = 'text'; lInput.value = Prefs.login(); lInput.placeholder = 'Логин';
  const pInput = document.createElement('input'); pInput.type = 'password'; pInput.value = Prefs.password(); pInput.placeholder = 'Пароль';
  acc.appendChild(lInput); acc.appendChild(pInput);
  const saveBtn = el('button', 'btn primary', 'Сохранить');
  saveBtn.onclick = () => {
    if (lInput.value.trim() && pInput.value) {
      Prefs.saveCredentials(lInput.value.trim(), pInput.value, Prefs.studentId());
      Diary.restoreSession(lInput.value.trim(), pInput.value);
      alert('Данные сохранены');
    } else alert('Введите логин и пароль');
  };
  acc.appendChild(saveBtn);

  // Тема
  const theme = el('div', 'card section');
  theme.innerHTML = '<h3>Тема оформления</h3>';
  ['system', 'light', 'dark', 'zhan'].forEach(t => {
    const names = { system: 'Системная', light: 'Светлая', dark: 'Тёмная', zhan: 'Альтернативная' };
    const b = document.createElement('button');
    b.className = 'btn ' + (getTheme() === t ? 'primary' : 'secondary');
    b.style.marginBottom = '6px';
    b.textContent = names[t];
    b.onclick = () => { setTheme(t); alert('Тема изменена'); renderCurrent(); };
    theme.appendChild(b);
  });

  // Расписание — свой класс
  const sched = el('div', 'card section');
  sched.innerHTML = '<h3>Расписание</h3>' +
    '<div class="muted" style="font-size:13px;margin-bottom:8px">Класс для показа расписания</div>';
  const classSel = document.createElement('select');
  classSel.className = 'gs-select';
  classSel.innerHTML = '<option value="">Не выбран</option>';
  classSel.onchange = () => {
    if (classSel.value) localStorage.setItem(CLASS_KEY, classSel.value);
    else localStorage.removeItem(CLASS_KEY);
  };
  sched.appendChild(classSel);
  fetchSchedule().then(sch => {
    const classes = (sch && sch.classes) || [];
    const cur = localStorage.getItem(CLASS_KEY) || '';
    if (!classes.length) { classSel.innerHTML = '<option value="">Список классов не загружен</option>'; return; }
    classSel.innerHTML = '<option value="">Не выбран</option>' + classes.map(c =>
      '<option value="' + escapeHtml(c) + '"' + (c === cur ? ' selected' : '') + '>' +
      escapeHtml(c) + '</option>').join('');
  }).catch(() => { classSel.innerHTML = '<option value="">Список классов не загружен</option>'; });

  // Уведомления
  const notif = el('div', 'card section');
  const unread = unreadNotifications();
  notif.innerHTML = '<h3>Уведомления</h3>' +
    '<div class="muted" style="font-size:13px;margin-bottom:10px">' +
    (unread ? 'Непрочитанных: ' + unread : 'Новых уведомлений нет') + '</div>';
  const openNotif = el('button', 'btn secondary', 'Открыть центр уведомлений');
  openNotif.onclick = () => { state.tab = 'notifications'; renderCurrent(); };
  notif.appendChild(openNotif);
  if (loadNotifications().length) {
    const clr = el('button', 'btn destructive small', 'Очистить историю');
    clr.style.marginTop = '8px';
    clr.onclick = () => { clearNotifications(); updateBell(); renderCurrent(); };
    notif.appendChild(clr);
  }

  // Версия и выход
  const ver = el('div', 'card section');
  ver.innerHTML = '<h3>Веб-версия 2.6.14web</h3>';
  const logout = el('button', 'btn destructive', 'Выйти из аккаунта');
  logout.onclick = () => {
    Prefs.clearCredentials();
    Diary.restoreSession('', '');
    showLogin();
  };
  ver.appendChild(logout);

  cont.appendChild(acc);
  cont.appendChild(theme);
  cont.appendChild(sched);
  cont.appendChild(notif);
  cont.appendChild(ver);
  return wrap;
}

// ---------------- Вход ----------------
async function doLogin() {
  const l = $('loginField').value.trim();
  const p = $('passwordField').value;
  const err = $('loginError');
  if (!l || !p) { err.textContent = 'Введите логин и пароль'; err.classList.remove('hidden'); return; }
  const btn = $('loginBtn');
  btn.disabled = true; btn.textContent = 'Вход…';
  err.classList.add('hidden');
  try {
    const info = await Diary.login(l, p);
    if (!info) {
      err.textContent = 'Неверный логин или пароль';
      err.classList.remove('hidden');
      return;
    }
    Prefs.saveCredentials(l, p, info.studentId);
    Prefs.setUserId(info.userId);
    const year = await Diary.getUchYear();
    Prefs.setUchYear(year);
    showApp();
  } catch (e) {
    err.textContent = 'Ошибка: ' + e.message;
    err.classList.remove('hidden');
  } finally {
    btn.disabled = false; btn.textContent = 'Войти';
  }
}

function showLogin() {
  $('loginScreen').classList.remove('hidden');
  $('appScreen').classList.add('hidden');
}

// ---------------- Переключение экранов ----------------
// Порядок как в приложении: Дневник · Оценки · События · Настройки
const TAB_ORDER = ['dairy', 'schedule', 'marks', 'goals', 'events', 'settings'];
let lastTabIndex = 0;
let transitionToken = 0;

function settleScreens(screens) {
  const kids = Array.prototype.slice.call(screens.children);
  if (kids.length > 1) kids.slice(0, -1).forEach(k => k.remove());
  kids.forEach(k => k.classList && k.classList.remove(
    'enter-from-right', 'enter-from-left', 'in', 'leave-to-left', 'leave-to-right', 'out'));
  screens.classList.remove('transitioning');
}

function buildScreen(t) {
  if (t === 'dairy') return renderDairy();
  if (t === 'schedule') return renderSchedule();
  if (t === 'marks') return renderMarks();
  if (t === 'goals') return renderGoals();
  if (t === 'events') return renderEvents();
  if (t === 'notifications') return renderNotifications();
  if (t === 'search') return renderSearch();
  if (t === 'settings') return renderSettings();
  return el('div');
}

function renderCurrent() {
  const screens = $('screens');
  const t = state.tab;
  const idx = TAB_ORDER.indexOf(t === 'search' ? 'dairy' : t);
  const safeIdx = idx < 0 ? lastTabIndex : idx;
  // направление сдвига: вперёд по вкладкам — вправо, назад — влево
  const dir = (safeIdx === lastTabIndex) ? 0 : (safeIdx > lastTabIndex ? 1 : -1);
  lastTabIndex = safeIdx;

  settleScreens(screens); // завершить прерванную анимацию, если была

  const node = document.createElement('div');
  node.className = 'screen';
  node.appendChild(buildScreen(t));

  const old = screens.firstElementChild;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (!old || reduce || !dir) {
    screens.innerHTML = '';
    screens.appendChild(node);
  } else {
    const tok = ++transitionToken;
    // обе вкладки на время перехода лежат слоями
    screens.classList.add('transitioning');
    node.classList.add(dir > 0 ? 'enter-from-right' : 'enter-from-left');
    old.classList.add(dir > 0 ? 'leave-to-left' : 'leave-to-right');
    screens.appendChild(node);
    void node.offsetWidth; // принудительный reflow, чтобы сработал transition
    node.classList.add('in');
    old.classList.add('out');

    let finished = false;
    const finish = () => {
      if (finished) return;
      finished = true;
      if (old.parentNode) old.remove();
      node.classList.remove('enter-from-right', 'enter-from-left', 'in');
      if (tok === transitionToken) screens.classList.remove('transitioning');
    };
    old.addEventListener('transitionend', finish, { once: true });
    setTimeout(finish, 420);
  }

  document.querySelectorAll('.nav-item').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === (t === 'search' ? 'dairy' : t)));
}

function showApp() {
  $('loginScreen').classList.add('hidden');
  $('appScreen').classList.remove('hidden');
  updateBell();
  renderCurrent();
  if (!showApp._notifChecked) {
    showApp._notifChecked = true;
    checkNotifications();
  }
}

// ---------------- Ивенты ----------------
$('loginBtn').onclick = doLogin;
$('loginField').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('passwordField').focus(); });
$('passwordField').addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

$('bellIcon').onclick = () => { state.tab = 'notifications'; renderCurrent(); };
document.querySelectorAll('.nav-item').forEach(b => {
  b.onclick = () => { state.tab = b.dataset.tab; renderCurrent(); };
});

// ---------------- Анимация запуска (SplashActivity) ----------------
// Терминал печатает строки, затем проявляется логотип и «Добро пожаловать».
const SPLASH_LINES = [
  '> инициализация системы',
  '> загружаю задания... ок',
  '> загружаю оценки... ок',
  '> загружаю дневник... ок',
  '> готово'
];
const SPLASH_TYPING_END = 1150;
const SPLASH_HOLD_END = 2350;
const SPLASH_TOTAL = SPLASH_LINES.reduce((a, l) => a + l.length, 0);

function runSplash(onDone) {
  const splash = $('splash');
  const term = $('splashTerminal');
  const start = performance.now();

  function frame(now) {
    const t = now - start;
    const shown = Math.min(t / SPLASH_TYPING_END, 1) * SPLASH_TOTAL;
    let consumed = 0;
    let html = '';
    let cursored = false;

    for (const line of SPLASH_LINES) {
      const remaining = shown - consumed;
      if (remaining > 0.5) {
        const chars = Math.min(Math.floor(remaining), line.length);
        const visible = line.slice(0, chars);
        if (chars < line.length) {
          html += '<div class="tline typing">' + visible + '<span class="cursor"></span></div>';
          cursored = true;
        } else {
          html += '<div class="tline">' + visible + '</div>';
        }
      }
      consumed += line.length;
    }
    if (!cursored && shown >= SPLASH_TOTAL && t < SPLASH_TYPING_END + 250) {
      html += '<div class="tline typing"><span class="cursor"></span></div>';
    }
    term.innerHTML = html;

    if (t < SPLASH_HOLD_END) {
      requestAnimationFrame(frame);
    } else {
      splash.classList.add('done');
      setTimeout(() => {
        splash.style.display = 'none';
        onDone();
      }, 320);
    }
  }
  requestAnimationFrame(frame);
}

// ---------------- Автологин при старте ----------------
async function startApp() {
  const l = Prefs.login(), p = Prefs.password();
  if (l && p) {
    await Diary.restoreSession(l, p); // дождаться SHA-1, иначе запросы уйдут без cookie
    showApp();
  }
}

runSplash(startApp);
